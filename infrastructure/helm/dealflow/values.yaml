# SampForce Helm values. Secrets are never set here: create a Secret (or use an external secrets operator)
# and name it in `secrets.existingSecret`. See docs/DEPLOYMENT.md.

image:
  registry: ""            # e.g. ghcr.io/sampledge
  tag: ""                 # defaults to the chart appVersion
  pullPolicy: IfNotPresent
  api: dealflow-api
  web: dealflow-web
  migrate: dealflow-migrate
imagePullSecrets: []

# Public URL people use; also used for SSO and OAuth redirect URIs.
publicUrl: https://app.example.com

secrets:
  # Secret with keys: DATABASE_URL (MongoDB replica-set URL for a user with the sampforce_runtime role, see docs/DEPLOYMENT.md),
  # MIGRATION_DATABASE_URL (same database, a user with readWrite and dbAdmin, for index set-up),
  # and nothing else. Every API key is entered in the operator console under Providers and stored in the database;
  # ENCRYPTION_KEY and the session signing secrets are created in the database on the first start (ADR 0059).
  existingSecret: dealflow-secrets

# Non-secret settings passed to the API and worker as environment variables.
config:
  LOG_LEVEL: info
  WORKER_POLL_MS: "2000"
  ACCESS_TOKEN_TTL_SECONDS: "900"
  REFRESH_TOKEN_TTL_DAYS: "30"
  AUTH_RATE_LIMIT_PER_MINUTE: "10"
  # Plan, checkout and email settings (PRICING_PUBLISHED, ONLINE_PAYMENTS_ENABLED, MAIL_FROM, ...) are not set here:
  # they live in the database and are changed in the operator console (ADR 0059).

api:
  replicas: 2
  port: 4000
  resources:
    requests: { cpu: 250m, memory: 384Mi }
    limits: { memory: 768Mi }
  autoscaling:
    enabled: true
    minReplicas: 2
    maxReplicas: 10
    targetCPUUtilizationPercentage: 70

worker:
  # Several copies are safe: every queue claim uses FOR UPDATE SKIP LOCKED with a lease.
  replicas: 2
  resources:
    requests: { cpu: 100m, memory: 256Mi }
    limits: { memory: 512Mi }

web:
  replicas: 2
  port: 3000
  resources:
    requests: { cpu: 100m, memory: 256Mi }
    limits: { memory: 512Mi }
  autoscaling:
    enabled: true
    minReplicas: 2
    maxReplicas: 6
    targetCPUUtilizationPercentage: 70

migrations:
  # Runs the database set-up (collections, indexes, plan catalogue) as a pre-install/pre-upgrade hook, so new code
  # never meets missing indexes. Idempotent.
  enabled: true
  backoffLimit: 1
  activeDeadlineSeconds: 600

metrics:
  port: 9464
  serviceMonitor:
    enabled: false        # needs the Prometheus Operator CRDs
    interval: 30s
  prometheusRule:
    enabled: false        # needs the Prometheus Operator CRDs

tracing:
  # OTLP/HTTP collector, e.g. http://otel-collector.observability:4318. Empty = tracing off.
  otlpEndpoint: ""

ingress:
  enabled: true
  className: nginx
  host: app.example.com
  # Team chat keeps a WebSocket open on /api/v1/chat/socket (ADR 0069). ingress-nginx passes WebSockets on by
  # itself; the longer timeouts stop it closing quiet connections (the API also pings every 25 seconds).
  annotations:
    nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "3600"
  tls:
    enabled: true
    secretName: dealflow-tls

podDisruptionBudget:
  enabled: true
  minAvailable: 1

networkPolicy:
  # Restricts ingress to the pods; egress stays open because the API calls identity providers, payment
  # providers, mail providers and the AI provider. Tighten egress with your own policy if you can list them.
  enabled: true
  ingressNamespaceSelector: {}   # e.g. { kubernetes.io/metadata.name: ingress-nginx }
  monitoringNamespaceSelector: {}

serviceAccount:
  create: true
  name: ""

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 1000
  runAsGroup: 1000
  fsGroup: 1000
  seccompProfile: { type: RuntimeDefault }

securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities: { drop: [ALL] }

nodeSelector: {}
tolerations: []
affinity: {}
