{{- if .Values.networkPolicy.enabled }}
{{- $np := .Values.networkPolicy }}
# The web pods accept traffic from the ingress controller; the API accepts it from the ingress controller
# and from the web pods (server-side rendering calls API_INTERNAL_URL). The worker accepts no traffic
# except metrics scrapes. Egress is not restricted here (see values.yaml).
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "dealflow.fullname" . }}-web
  labels:
    {{- include "dealflow.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "dealflow.selector" (dict "root" . "component" "web") | nindent 6 }}
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              {{- toYaml $np.ingressNamespaceSelector | nindent 14 }}
      ports:
        - { port: http }
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "dealflow.fullname" . }}-api
  labels:
    {{- include "dealflow.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "dealflow.selector" (dict "root" . "component" "api") | nindent 6 }}
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              {{- toYaml $np.ingressNamespaceSelector | nindent 14 }}
        - podSelector:
            matchLabels:
              {{- include "dealflow.selector" (dict "root" . "component" "web") | nindent 14 }}
      ports:
        - { port: http }
    - from:
        - namespaceSelector:
            matchLabels:
              {{- toYaml $np.monitoringNamespaceSelector | nindent 14 }}
      ports:
        - { port: metrics }
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "dealflow.fullname" . }}-worker
  labels:
    {{- include "dealflow.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "dealflow.selector" (dict "root" . "component" "worker") | nindent 6 }}
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              {{- toYaml $np.monitoringNamespaceSelector | nindent 14 }}
      ports:
        - { port: metrics }
{{- end }}
