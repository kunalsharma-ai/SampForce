{{- $c := dict "root" . "component" "web" }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "dealflow.fullname" . }}-web
  labels:
    {{- include "dealflow.labels" . | nindent 4 }}
    app.kubernetes.io/component: web
spec:
  {{- if not .Values.web.autoscaling.enabled }}
  replicas: {{ .Values.web.replicas }}
  {{- end }}
  revisionHistoryLimit: 5
  strategy:
    type: RollingUpdate
    rollingUpdate: { maxUnavailable: 0, maxSurge: 1 }
  selector:
    matchLabels:
      {{- include "dealflow.selector" $c | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "dealflow.labels" . | nindent 8 }}
        app.kubernetes.io/component: web
    spec:
      serviceAccountName: {{ include "dealflow.serviceAccountName" . }}
      automountServiceAccountToken: false
      {{- include "dealflow.podSecurity" . | nindent 6 }}
      containers:
        - name: web
          image: {{ include "dealflow.image" (dict "root" . "name" .Values.image.web) }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - { name: http, containerPort: {{ .Values.web.port }} }
          env:
            - name: PORT
              value: {{ .Values.web.port | quote }}
            # Server-side fetches (the pricing page) go straight to the API service.
            - name: API_INTERNAL_URL
              value: {{ printf "http://%s-api:%v" (include "dealflow.fullname" .) .Values.api.port | quote }}
          readinessProbe:
            httpGet: { path: /healthz, port: http }
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /healthz, port: http }
            initialDelaySeconds: 15
            periodSeconds: 20
          resources:
            {{- toYaml .Values.web.resources | nindent 12 }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          volumeMounts:
            # Next.js writes its data cache here; everything else in the image is read-only.
            - { name: next-cache, mountPath: /app/apps/web/.next/cache }
            - { name: tmp, mountPath: /tmp }
      volumes:
        - { name: next-cache, emptyDir: { sizeLimit: 512Mi } }
        - { name: tmp, emptyDir: { sizeLimit: 128Mi } }
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "dealflow.fullname" . }}-web
  labels:
    {{- include "dealflow.labels" . | nindent 4 }}
    app.kubernetes.io/component: web
spec:
  selector:
    {{- include "dealflow.selector" $c | nindent 4 }}
  ports:
    - { name: http, port: {{ .Values.web.port }}, targetPort: http }
