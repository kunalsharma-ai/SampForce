{{- $c := dict "root" . "component" "api" }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "dealflow.fullname" . }}-api
  labels:
    {{- include "dealflow.labels" . | nindent 4 }}
    app.kubernetes.io/component: api
spec:
  {{- if not .Values.api.autoscaling.enabled }}
  replicas: {{ .Values.api.replicas }}
  {{- end }}
  revisionHistoryLimit: 5
  strategy:
    type: RollingUpdate
    rollingUpdate: { maxUnavailable: 0, maxSurge: 1 }
  selector:
    matchLabels:
      {{- include "dealflow.selector" $c | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "dealflow.labels" . | nindent 8 }}
        app.kubernetes.io/component: api
    spec:
      serviceAccountName: {{ include "dealflow.serviceAccountName" . }}
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 30
      {{- include "dealflow.podSecurity" . | nindent 6 }}
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              {{- include "dealflow.selector" $c | nindent 14 }}
      containers:
        - name: api
          image: {{ include "dealflow.image" (dict "root" . "name" .Values.image.api) }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - { name: http, containerPort: {{ .Values.api.port }} }
            - { name: metrics, containerPort: {{ .Values.metrics.port }} }
          env:
            - name: API_PORT
              value: {{ .Values.api.port | quote }}
            - name: OTEL_SERVICE_NAME
              value: sampforce-api
            {{- include "dealflow.serverEnv" . | nindent 12 }}
          envFrom:
            - secretRef:
                name: {{ .Values.secrets.existingSecret }}
          readinessProbe:
            httpGet: { path: /api/v1/health/ready, port: http }
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            httpGet: { path: /api/v1/health/live, port: http }
            initialDelaySeconds: 20
            periodSeconds: 20
            timeoutSeconds: 3
          startupProbe:
            httpGet: { path: /api/v1/health/live, port: http }
            periodSeconds: 3
            failureThreshold: 40
          resources:
            {{- toYaml .Values.api.resources | nindent 12 }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          volumeMounts:
            - { name: tmp, mountPath: /tmp }
      volumes:
        - { name: tmp, emptyDir: { sizeLimit: 256Mi } }
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "dealflow.fullname" . }}-api
  labels:
    {{- include "dealflow.labels" . | nindent 4 }}
    app.kubernetes.io/component: api
spec:
  selector:
    {{- include "dealflow.selector" $c | nindent 4 }}
  ports:
    - { name: http, port: {{ .Values.api.port }}, targetPort: http }
    - { name: metrics, port: {{ .Values.metrics.port }}, targetPort: metrics }
