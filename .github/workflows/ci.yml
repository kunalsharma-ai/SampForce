name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      # Two databases on one MongoDB replica set: the API suite drops and rebuilds sampforce_test; the browser suite
      # runs against sampforce.
      TEST_DATABASE_URL: mongodb://localhost:27017/sampforce_test?replicaSet=rs0
      DATABASE_URL: mongodb://localhost:27017/sampforce?replicaSet=rs0
      E2E_DATABASE_URL: mongodb://localhost:27017/sampforce?replicaSet=rs0
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@v4
      # Service containers cannot take arguments, and transactions need a replica set, so MongoDB starts here.
      - name: Start MongoDB (single-node replica set)
        run: |
          docker run -d --name mongo -p 27017:27017 mongo:8.0 --replSet rs0 --bind_ip_all
          up() { [ "$(docker inspect -f '{{.State.Running}}' mongo)" = true ] || { docker logs mongo; exit 1; }; }
          for i in $(seq 1 60); do up; docker exec mongo mongosh --quiet --eval 'db.runCommand({ ping: 1 }).ok' >/dev/null 2>&1 && break; sleep 1; done
          docker exec mongo mongosh --quiet --eval "rs.initiate({ _id: 'rs0', members: [{ _id: 0, host: 'localhost:27017' }] })"
          for i in $(seq 1 60); do up; [ "$(docker exec mongo mongosh --quiet --eval 'db.hello().isWritablePrimary')" = "true" ] && break; sleep 1; done
          docker exec mongo mongosh --quiet --eval 'db.hello().isWritablePrimary' | grep -q true || { docker logs mongo; exit 1; }
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - name: Database set-up (collections, indexes, plans), twice to prove it is idempotent
        run: |
          pnpm db:setup
          pnpm db:setup
      - run: pnpm lint
      - run: pnpm typecheck
      - name: Unit and API integration tests (incl. tenant isolation)
        run: pnpm test
      - name: Install Playwright browser
        run: pnpm --filter @dealflow/web exec playwright install --with-deps chromium
      - name: End-to-end and accessibility tests
        run: pnpm test:e2e
      - name: Component catalogue builds, and every story renders and passes axe (dark, light, right to left)
        run: |
          pnpm --filter @dealflow/web build-storybook
          pnpm --filter @dealflow/web test:storybook
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: apps/web/playwright-report

  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build API image
        run: docker build -f apps/api/Dockerfile -t dealflow-api:ci .
      - name: Build web image
        run: docker build -f apps/web/Dockerfile -t dealflow-web:ci .
      - name: Build database set-up image
        run: docker build -f apps/api/Dockerfile --target migrate -t dealflow-migrate:ci .

  helm:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v4
        with:
          version: v3.16.2
      - name: Lint the chart
        run: helm lint infrastructure/helm/dealflow -f infrastructure/helm/dealflow/ci-values.yaml --strict
      - name: Render and validate against Kubernetes schemas
        run: |
          mkdir -p rendered
          helm template dealflow infrastructure/helm/dealflow -f infrastructure/helm/dealflow/ci-values.yaml > rendered/all.yaml
          docker run --rm -v "$PWD/rendered:/rendered" ghcr.io/yannh/kubeconform:v0.6.7 \
            -strict -summary -ignore-missing-schemas -kubernetes-version 1.30.0 /rendered/all.yaml
