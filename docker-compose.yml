# Local stack. `docker compose up -d mongo redis` gives you the databases for `pnpm dev`;
# `docker compose up --build` runs everything in containers.
services:
  # MongoDB as a single-node replica set: SampForce uses multi-document transactions, which need one.
  mongo:
    image: mongo:7.0
    command: ['--replSet', 'rs0', '--bind_ip_all']
    ports: ['27017:27017']
    volumes:
      - mongodata:/data/db
    healthcheck:
      # Initiates the replica set on first start (advertising the service name), then reports whether it is primary.
      test: ['CMD', 'mongosh', '--quiet', '--eval', "try { rs.status().ok } catch (e) { rs.initiate({ _id: 'rs0', members: [{ _id: 0, host: 'mongo:27017' }] }).ok }; db.hello().isWritablePrimary || quit(1)"]
      interval: 5s
      retries: 20

  redis:
    image: redis:7-alpine
    ports: ['6379:6379']

  # Collections, indexes and the plan catalogue (idempotent; runs before the API and worker start).
  migrate:
    build: { context: ., dockerfile: apps/api/Dockerfile, target: migrate }
    environment:
      DATABASE_URL: mongodb://mongo:27017/sampforce?replicaSet=rs0
    depends_on:
      mongo: { condition: service_healthy }

  api:
    build: { context: ., dockerfile: apps/api/Dockerfile }
    environment:
      NODE_ENV: production
      DATABASE_URL: mongodb://mongo:27017/sampforce?replicaSet=rs0
      REDIS_URL: redis://redis:6379
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:?set JWT_ACCESS_SECRET in .env}
      # Local stack runs over http://localhost. Never set ALLOW_INSECURE_COOKIES in a real deployment.
      COOKIE_SECURE: 'false'
      ALLOW_INSECURE_COOKIES: 'true'
      WEB_ORIGINS: http://localhost:3000
      ENCRYPTION_KEY: ${ENCRYPTION_KEY:?set ENCRYPTION_KEY in .env}
      PUBLIC_WEB_URL: http://localhost:3000
      # AI is optional: leave ANTHROPIC_API_KEY unset in .env and agents report "not configured".
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      AI_MODEL: ${AI_MODEL:-claude-opus-5-5}
    ports: ['4000:4000']
    depends_on:
      migrate: { condition: service_completed_successfully }

  # Background worker: outbox relay, workflow runs, webhooks, approval expiry, mailbox sync, queued AI runs.
  worker:
    build: { context: ., dockerfile: apps/api/Dockerfile }
    command: ['node', 'dist/worker.js']
    environment:
      NODE_ENV: production
      DATABASE_URL: mongodb://mongo:27017/sampforce?replicaSet=rs0
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:?set JWT_ACCESS_SECRET in .env}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY:?set ENCRYPTION_KEY in .env}
      COOKIE_SECURE: 'false'
      ALLOW_INSECURE_COOKIES: 'true'
      PUBLIC_WEB_URL: http://localhost:3000
      # AI is optional: leave ANTHROPIC_API_KEY unset in .env and agents report "not configured".
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      AI_MODEL: ${AI_MODEL:-claude-opus-5-5}
    depends_on:
      migrate: { condition: service_completed_successfully }

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args: { API_INTERNAL_URL: http://api:4000 }
    ports: ['3000:3000']
    depends_on: [api]

volumes:
  mongodata:
