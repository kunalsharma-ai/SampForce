# SampForce on one Linux server with Docker Compose. See deploy/SERVER_SETUP.md.
#
#   cd deploy
#   docker compose -f docker-compose.prod.yml up -d --build
#
# Two settings files sit next to this one (both created by scripts/generate-secrets.sh):
#   .env          secrets and server settings that compose fills into this file (DOMAIN, passwords, keys)
#   sampforce.env optional application settings, passed as-is to the API and the worker
#
# Only Caddy publishes ports (80 and 443). MongoDB, the API, the worker and the web server are reachable only
# on the internal network. Caddy obtains and renews the TLS certificate for DOMAIN from Let's Encrypt.

# The compose project keeps its original name: it names the volumes, so renaming it would orphan them.
name: dealflow

x-hardened: &hardened
  restart: unless-stopped
  read_only: true
  cap_drop: [ALL]
  security_opt: ['no-new-privileges:true']
  tmpfs: [/tmp]
  logging:
    driver: json-file
    options: { max-size: 10m, max-file: '5' }

# Settings the API and the worker must agree on. `environment` wins over `env_file`, so sampforce.env cannot
# override these by accident.
x-app-env: &app-env
  NODE_ENV: production
  DATABASE_URL: mongodb://sampforce_app:${SAMPFORCE_APP_PASSWORD:?run scripts/generate-secrets.sh}@mongo:27017/${SAMPFORCE_DB:-sampforce}?replicaSet=rs0&authSource=admin&maxPoolSize=${DB_CONNECTION_LIMIT:-10}
  JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:?run scripts/generate-secrets.sh}
  ENCRYPTION_KEY: ${ENCRYPTION_KEY:?run scripts/generate-secrets.sh}
  OPERATOR_JWT_SECRET: ${OPERATOR_JWT_SECRET:?run scripts/generate-secrets.sh}
  COOKIE_SECURE: 'true'
  PUBLIC_WEB_URL: https://${DOMAIN:?set DOMAIN in .env}
  WEB_ORIGINS: ${WEB_ORIGINS:-https://${DOMAIN}}
  METRICS_PORT: '9464'

services:
  # MongoDB 8, a one-member replica set with authentication (see mongo/start.sh and mongo/healthcheck.sh).
  mongo:
    image: mongo:8.0
    restart: unless-stopped
    entrypoint: ['bash', '/sampforce/start.sh']
    environment:
      MONGO_INITDB_ROOT_USERNAME: root
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD:?run scripts/generate-secrets.sh}
      # Read once, on the very first start, by mongo/init-sampforce.js (the three SampForce users).
      SAMPFORCE_DB: ${SAMPFORCE_DB:-sampforce}
      SAMPFORCE_APP_PASSWORD: ${SAMPFORCE_APP_PASSWORD:?run scripts/generate-secrets.sh}
      SAMPFORCE_ADMIN_PASSWORD: ${SAMPFORCE_ADMIN_PASSWORD:?run scripts/generate-secrets.sh}
      SAMPFORCE_BACKUP_PASSWORD: ${SAMPFORCE_BACKUP_PASSWORD:?run scripts/generate-secrets.sh}
    volumes:
      - mongodata:/data/db
      - mongoconfig:/data/configdb
      - ./mongo/start.sh:/sampforce/start.sh:ro
      - ./mongo/healthcheck.sh:/sampforce/healthcheck.sh:ro
      - ./mongo/keyfile:/sampforce/keyfile:ro
      - ./mongo/init-sampforce.js:/docker-entrypoint-initdb.d/10-sampforce.js:ro
    healthcheck:
      test: ['CMD', 'bash', '/sampforce/healthcheck.sh']
      interval: 5s
      timeout: 10s
      retries: 30
      start_period: 20s
    logging:
      driver: json-file
      options: { max-size: 10m, max-file: '5' }

  # Creates collections and indexes and seeds the plan catalogue, then exits (idempotent). The API and the worker
  # wait for it to succeed.
  migrate:
    <<: *hardened
    image: ${SAMPFORCE_MIGRATE_IMAGE:-sampforce-migrate:local}
    build: { context: .., dockerfile: apps/api/Dockerfile, target: migrate }
    restart: 'no'
    user: '1000:1000'
    environment:
      NODE_ENV: production
      DATABASE_URL: mongodb://sampforce_admin:${SAMPFORCE_ADMIN_PASSWORD}@mongo:27017/${SAMPFORCE_DB:-sampforce}?replicaSet=rs0&authSource=admin
    depends_on:
      mongo: { condition: service_healthy }

  api:
    <<: *hardened
    image: ${SAMPFORCE_API_IMAGE:-sampforce-api:local}
    build: { context: .., dockerfile: apps/api/Dockerfile }
    user: '1000:1000'
    env_file: [sampforce.env]
    environment: *app-env
    depends_on:
      migrate: { condition: service_completed_successfully }
    # The image's own HEALTHCHECK calls /api/v1/health/ready.

  # Background jobs: outbox relay, workflow runs, webhooks, approval expiry, mailbox sync, queued AI runs.
  worker:
    <<: *hardened
    image: ${SAMPFORCE_API_IMAGE:-sampforce-api:local}
    user: '1000:1000'
    command: ['node', 'dist/worker.js']
    env_file: [sampforce.env]
    environment: *app-env
    depends_on:
      migrate: { condition: service_completed_successfully }
      api: { condition: service_started }
    healthcheck:
      # Fails when the worker has not finished a cycle for 5 minutes.
      test: ['CMD', 'node', '-e', "fetch('http://localhost:9464/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

  web:
    <<: *hardened
    image: ${SAMPFORCE_WEB_IMAGE:-sampforce-web:local}
    build:
      context: ..
      dockerfile: apps/web/Dockerfile
      args: { API_INTERNAL_URL: http://api:4000 }
    user: '1000:1000'
    tmpfs: [/tmp, /app/apps/web/.next/cache]
    environment:
      API_INTERNAL_URL: http://api:4000
    depends_on:
      api: { condition: service_healthy }
    healthcheck:
      test: ['CMD', 'node', '-e', "fetch('http://localhost:3000/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 3s
      retries: 5
      start_period: 20s

  # Public entry point: HTTPS with automatic certificates, /api/v1/* to the API, everything else to the web app.
  caddy:
    image: caddy:2.8
    restart: unless-stopped
    ports:
      - '80:80'
      - '443:443'
      - '443:443/udp'
    environment:
      DOMAIN: ${DOMAIN}
      ACME_EMAIL: ${ACME_EMAIL:?set ACME_EMAIL in .env}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      web: { condition: service_healthy }
    logging:
      driver: json-file
      options: { max-size: 10m, max-file: '5' }

  # Not started by `up`. scripts/backup.sh and scripts/restore.sh run it on demand (mongodump and mongorestore).
  backup:
    image: mongo:8.0
    profiles: [tools]
    restart: 'no'
    # Runs as the user who called scripts/backup.sh, so that user owns (and can copy off-site) the backup files.
    user: '${BACKUP_UID:-0}:${BACKUP_GID:-0}'
    environment:
      HOME: /tmp
      SAMPFORCE_DB: ${SAMPFORCE_DB:-sampforce}
      BACKUP_DATABASE_URL: mongodb://sampforce_backup:${SAMPFORCE_BACKUP_PASSWORD}@mongo:27017/?replicaSet=rs0&authSource=admin
      RESTORE_ADMIN_URL: mongodb://root:${MONGO_ROOT_PASSWORD}@mongo:27017/?replicaSet=rs0&authSource=admin
    volumes:
      - ../scripts:/sampforce/scripts:ro
      - ${BACKUP_DIR:-./backups}:/backups
    # umask 077: backups contain every workspace's data, so only their owner may read them.
    entrypoint: ['bash', '-c', 'umask 077 && exec bash /sampforce/scripts/backup.sh /backups']
    depends_on:
      mongo: { condition: service_healthy }

volumes:
  mongodata:
  mongoconfig:
  caddy_data:
  caddy_config:
